<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B2BFF"/>
      <stop offset="0.5" stop-color="#E0249A"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.25" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="face" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF3A0"/>
      <stop offset="0.45" stop-color="#FFD630"/>
      <stop offset="1" stop-color="#FF9E0B"/>
    </radialGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B8B"/>
      <stop offset="1" stop-color="#E8335A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="faceShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3A0060" flood-opacity="0.45"/>
    </filter>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="faceClip"><circle cx="512" cy="530" r="232"/></clipPath>
  </defs>
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
    <g transform="translate(512 512) scale(1.0000) translate(-512 -512)">
      <!-- emoji face -->
      <circle cx="512" cy="530" r="232" fill="url(#face)" filter="url(#faceShadow)"/>
      <!-- open eye + wink -->
      <ellipse cx="430" cy="470" rx="30" ry="44" fill="#3B1D0E"/>
      <circle cx="440" cy="455" r="10" fill="#FFFFFF"/>
      <path d="M 560 474 Q 600 438 640 474" fill="none" stroke="#3B1D0E" stroke-width="22" stroke-linecap="round"/>
      <!-- grin with tongue -->
      <path d="M 392 560 Q 512 690 632 560 Z" fill="#3B1D0E" stroke="#3B1D0E" stroke-width="18" stroke-linejoin="round"/>
      <path d="M 470 615 Q 520 585 566 612 Q 560 668 514 672 Q 474 668 470 615 Z" fill="url(#tongue)"/>
      <path d="M 518 600 L 516 650" stroke="#C4234A" stroke-width="6" stroke-linecap="round"/>
      <!-- AI scan line across the face -->
      <g clip-path="url(#faceClip)">
        <rect x="270" y="518" width="484" height="12" fill="#3DF5FF" opacity="0.85" filter="url(#neon)"/>
        <rect x="270" y="380" width="484" height="140" fill="#3DF5FF" opacity="0.10"/>
      </g>

      <!-- neon tracking brackets -->
      <path d="M 236 328 V 236 H 328 M 696 236 H 788 V 328 M 788 696 V 788 H 696 M 328 788 H 236 V 696" fill="none" stroke="#3DF5FF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
      <path d="M 760 270 Q 760 300 790 300 Q 760 300 760 330 Q 760 300 730 300 Q 760 300 760 270 Z" fill="#FFFFFF" opacity="1"/>
      <path d="M 288 718 Q 288 740 310 740 Q 288 740 288 762 Q 288 740 266 740 Q 288 740 288 718 Z" fill="#FFFFFF" opacity="0.85"/>
      <path d="M 800 674 Q 800 690 816 690 Q 800 690 800 706 Q 800 690 784 690 Q 800 690 800 674 Z" fill="#FFFFFF" opacity="0.7"/>
    </g>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
  </g>
</svg>