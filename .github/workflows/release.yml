name: Build and Release

# Every push to main publishes a new release. Installed apps pick it up through the auto-updater.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'start-server.*'
  workflow_dispatch:

permissions:
  contents: write

# Never build two releases at the same time (version numbers would collide)
concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Next version = latest v* tag + 1 patch. Bumping "version" in package.json above the
      # latest tag (e.g. to 1.1.0 or 2.0.0) makes that the next release instead.
      - name: Compute next version
        id: next
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          pkg=$(node -p "require('./package.json').version")
          if [ -z "$latest" ]; then
            next="$pkg"
          else
            IFS=. read -r major minor patch <<< "$latest"
            bumped="$major.$minor.$((patch + 1))"
            highest=$(printf '%s\n%s\n' "$bumped" "$pkg" | sort -V | tail -n1)
            next="$highest"
          fi
          echo "Latest tag: ${latest:-none} | package.json: $pkg | next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      # The release starts as a draft: installed apps only see it once every file is uploaded
      - name: Create tag and draft release
        run: |
          v="${{ steps.next.outputs.version }}"
          git tag "v$v"
          git push origin "v$v"
          cat > notes.md <<NOTES
          ## Que ficheiro descarregar?

          | Computador | Ficheiro |
          |---|---|
          | **Windows** | \`Emotions-Challenge-Setup-$v.exe\` |
          | **Mac com chip Apple (M1, M2, M3, M4…)** | \`Emotions-Challenge-$v-mac-arm64.dmg\` |
          | **Mac com processador Intel** | \`Emotions-Challenge-$v-mac-x64.dmg\` |

          Se a app já estiver instalada, não é preciso descarregar nada: ela avisa que há uma versão nova e atualiza-se sozinha.

          Os ficheiros \`.zip\`, \`.yml\` e \`.blockmap\` são usados pela atualização automática.
          NOTES
          gh release create "v$v" --draft --title "$v" --notes-file notes.md

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            # Installers (.dmg) + what the mac self-updater downloads (.zip + latest-mac.yml)
            files: dist-electron/*.dmg dist-electron/*-mac-*.zip dist-electron/latest-mac.yml
          - os: windows-latest
            # Installer + blockmap (lets Windows download only what changed) + latest.yml
            files: dist-electron/*-Setup-*.exe dist-electron/*-Setup-*.exe.blockmap dist-electron/latest.yml
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Set version
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build
        run: npx electron-builder --publish never

      # Upload only what is needed (no .dmg/.zip blockmaps, no debug files)
      - name: Upload to the draft release
        run: |
          ls -la dist-electron
          gh release upload "v${{ needs.version.outputs.version }}" ${{ matrix.files }} --clobber

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "v${{ needs.version.outputs.version }}" --draft=false --latest
